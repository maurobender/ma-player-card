<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html { --primary-color:#03a9f4; --secondary-background-color:#eef1f5; --primary-text-color:#1a1a1a; --primary-background-color:#f2f2f7;
    --secondary-text-color:#666; --card-background-color:#fff; --divider-color:#ddd; --text-primary-color:#fff; }
  body { background:#f4f6fa; font-family: sans-serif; margin:0; padding:16px; }
  ha-card { display:block; background:var(--card-background-color); border-radius:32px; }
  ha-icon { display:inline-block; width:var(--mdc-icon-size,24px); height:var(--mdc-icon-size,24px); }
  ha-icon::before { content:"◆"; }
</style></head>
<body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:1100px">
<div style="height:140px;border-radius:32px;background:linear-gradient(135deg,#ff9a3c,#ff3c78)"></div>
<div style="height:140px;border-radius:32px;background:linear-gradient(135deg,#3cc4ff,#6b3cff)"></div>
<div style="height:140px;border-radius:32px;background:linear-gradient(135deg,#3cff9a,#2a9d8f)"></div>
<div id="host" style="grid-column:span 3"></div>
<div style="height:300px;border-radius:32px;background:linear-gradient(135deg,#ffd93c,#ff6b3c)"></div>
<div style="height:300px;border-radius:32px;background:#fff"></div>
<div style="height:300px;border-radius:32px;background:linear-gradient(135deg,#a33cff,#3c6bff)"></div></div>
<script>
  customElements.define("ha-card", class extends HTMLElement {});
  customElements.define("ha-icon", class extends HTMLElement {});
  window.calls = [];
  const img = (n) => `https://picsum.photos/seed/${n}/300`;
  const hass = {
    locale: { language: new URLSearchParams(location.search).get("lang") || "en" },
    states: { "media_player.salon": { state: "idle", attributes: { friendly_name: "Salón" } },
      "media_player.cocina": { state: "playing", attributes: { friendly_name: "Cocina", media_title: "Bohemian Rhapsody", media_artist: "Queen" } },
      "media_player.dormitorio": { state: "unavailable", attributes: { friendly_name: "Dormitorio" } } },
    entities: { "media_player.salon": { platform: "music_assistant" }, "media_player.cocina": { platform: "music_assistant" },
      "media_player.dormitorio": { platform: "music_assistant" }, "media_player.tv": { platform: "cast" } },
    async callWS(msg) {
      calls.push(msg);
      await new Promise((r) => setTimeout(r, 400));
      if (msg.type === "config/entity_registry/get") return { platform: "music_assistant", config_entry_id: "XYZ" };
      if (msg.service === "get_library") {
        const d = msg.service_data; if (d.media_type === "radio") throw { message: "fallo radio" };
        return { response: { items: Array.from({ length: 12 }, (_, i) => ({ media_type: d.media_type, uri: `library://${d.media_type}/${i}`,
          name: `${d.media_type} ${d.order_by} ${i}`, image: img(d.media_type + d.order_by + i), artists: [{ name: "Artista" }] })) } };
      }
      if (msg.service === "search") {
        const q = msg.service_data.name;
        if (q === "error") throw { code: "x", message: "Fallo simulado" };
        if (q === "nada") return { response: { tracks: [], artists: [] } };
        const mk = (t, i) => ({ media_type: t, uri: `spotify://${t}/${i}`, name: `${q} ${t} ${i}`,
          image: i === 2 ? "https://invalid.example/x.jpg" : img(t + i),
          artists: [{ name: "Queen" }], album: { name: "A Night at the Opera" } });
        const key = { track: "tracks", artist: "artists", album: "albums", playlist: "playlists", radio: "radio" }[msg.service_data.media_type];
        return { response: { [key]: Array.from({ length: 10 }, (_, i) => mk(msg.service_data.media_type, i)) } };
      }
      if (msg.type === "media_player/browse_media") {
        const id = msg.media_content_id;
        if (id.includes("/9")) throw { code: "x", message: "Browse falló" };
        if (msg.media_content_type === "artist")
          return { title: "x", media_class: "artist", media_content_id: id, children: Array.from({ length: 6 }, (_, i) =>
            ({ title: `Queen - Album ${i}`, media_class: "album", media_content_id: `library://album/a${i}`, thumbnail: img("al" + i) })) };
        return { title: "x", media_class: msg.media_content_type, media_content_id: id, children: Array.from({ length: 12 }, (_, i) =>
          ({ title: `${i === 3 ? "Freddie Mercury" : "Queen"} - Song ${i + 1}`, media_class: "track", media_content_id: `library://track/t${i}`, thumbnail: img("t" + i) })) };
      }
      return {};
    },
    async callService(domain, service, data) {
      calls.push({ domain, service, data });
      if (service === "shuffle_set") hass.states[data.entity_id].attributes.shuffle = data.shuffle;
    },
  };
  const card = document.createElement("ma-browser-card");
  document.getElementById("host").appendChild(card);
  import("./build/ma-player-card.js").then(() => {
    card.setConfig({ entity: "media_player.salon", limit: 10, ...(window.cfg||{}) });
    card.hass = hass;
  });
</script>
</body></html>
