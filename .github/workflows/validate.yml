# Checks the repository against HACS's requirements (hacs.json, description, topics, license…).
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: plugin
          # brands is for integrations only
          ignore: brands
